<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <title>پنل مدیریت</title>
    <!-- لینک بوت‌استرپ -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      #tr {
        background-color: red;
      }

      #editUser {
        display: none;
      }
      #panelAdmin {
        display: block;
      }
      #closeBtn {
        display: flex;
        justify-content: end;
        color: red;
      }
      #closeBtn:hover {
        cursor: pointer;
        font-size: 30px;
      }
    </style>
  </head>
  <body class="bg-light">
    <!-- نوار بالا -->
    <nav class="navbar navbar-light bg-white shadow-sm px-3">
      <span class="navbar-brand mb-0 h4">پنل مدیریت</span>
      <button id="logoutBtn" class="btn btn-danger">خروج</button>
    </nav>

    <!-- محتوای اصلی -->
    <div id="panelAdmin" class="container mt-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title mb-3">لیست کاربران</h5>

          <!-- جدول کاربران -->
          <div class="table-responsive">
            <table class="table table-bordered table-striped align-middle">
              <thead class="table-light">
                <tr>
                  <th>نام</th>
                  <th>نام خانوادگی</th>
                  <th>ایمیل</th>
                  <th>نقش</th>
                  <th>اقدامات</th>
                </tr>
              </thead>
              <tbody id="headItem"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- صفحه ایدت اطلاعات -->

    <div
      id="editUser"
      class="container justify-content-center align-items-center vh-100"
    >
      <div class="card shadow-sm p-4" style="max-width: 500px; width: 100%">
        <h3 id="closeBtn">X</h3>
        <h4 class="text-center mb-4">ویرایش کاربر</h4>

        <form>
          <!-- نام -->
          <div class="mb-3">
            <label for="firstName" class="form-label">نام</label>
            <input
              type="text"
              class="form-control"
              id="edit-firstName"
              value="mersad"
            />
          </div>

          <!-- نام خانوادگی -->
          <div class="mb-3">
            <label for="lastName" class="form-label">نام خانوادگی</label>
            <input
              type="text"
              class="form-control"
              id="edit-lastName"
              value="rostami"
            />
          </div>

          <!-- سن -->
          <div class="mb-3">
            <label for="age" class="form-label">سن</label>
            <input
              type="number"
              id="edit-age"
              class="form-control"
              id="age"
              value="28"
            />
          </div>

          <!-- ایمیل -->
          <div class="mb-3">
            <label for="email" class="form-label">ایمیل</label>
            <input
              type="email"
              class="form-control"
              id="edit-email"
              value="mersad@yahoo.com"
            />
          </div>

          <!-- رمز عبور -->
          <div class="mb-3">
            <label for="password" class="form-label">رمز عبور</label>
            <input
              type="password"
              class="form-control"
              id="edit-password"
              placeholder="رمز عبور جدید"
            />
          </div>

          <!-- نقش -->
          <div class="mb-3">
            <label for="role" class="form-label">نقش</label>
            <select class="form-select" id="edit-role">
              <option value="admin">Admin</option>
              <option value="user" selected>User</option>
              <option value="guest">Guest</option>
            </select>
          </div>

          <!-- دکمه ذخیره تغییرات -->
          <button type="submit" id="edit_submit" class="btn btn-primary w-100">
            ذخیره تغییرات
          </button>
        </form>
      </div>
    </div>

    <!-- آیکون‌های بوت‌استرپ -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <!-- اسکریپت بوت‌استرپ -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      window.addEventListener("load", async () => {
        const user = JSON.parse(localStorage.getItem("user"));

        if (!user) {
          return (window.location.href = "/files/login.html");
        }

        if (user.role != "admin") {
          return (window.location.href = "/files/login.html");
        }

        const headItem = document.querySelector("#headItem");

        const response = await fetch("http://localhost:3000/users");
        const result = await response.json();

        result.forEach((user) => {
          headItem.innerHTML += `
      <tr>
        <td>${user.firstName}</td>
        <td>${user.lastName}</td>
        <td>${user.email}</td>
        <td>${user.role}</td>
        <td>
          <button class="btn btn-sm btn-primary me-1" onclick="openEdit(${user.id})">
            ویرایش
          </button>

          <button class="btn btn-sm btn-danger" onclick="deleteUser(${user.id})">
            حذف
          </button>
        </td>
      </tr>
    `;
        });
      });

      const logoutBtn = document.querySelector("#logoutBtn");

      logoutBtn.addEventListener("click", () => {
        localStorage.removeItem("user");
        window.location.href = "/files/login.html";
      });

      async function deleteUser(userId) {
        const confirmDelete = confirm("میخواهی این یوزیر را دلیت کنید!");

        if (confirmDelete) {
          const response = await fetch(
            `http://localhost:3000/users/${userId}`,
            {
              method: "DELETE",
            },
          );

          if (response.ok) {
            alert("User deleted");
            location.reload();
          }
        }
      }

      // edit user
      const editUser = document.querySelector("#editUser");
      const panelAdmin = document.querySelector("#panelAdmin");
      const closeBtn = document.querySelector("#closeBtn");

      closeBtn.addEventListener("click", () => {
        panelAdmin.style.display = "block";
        editUser.style.display = "none";
      });

      async function openEdit(userId) {
        editUser.style.display = "flex";
        panelAdmin.style.display = "none";

        const response = await fetch(`http://localhost:3000/users/${userId}`);
        const result = await response.json();

        document.querySelector("#edit-firstName").value = result.firstName;
        document.querySelector("#edit-lastName").value = result.lastName;
        document.querySelector("#edit-age").value = result.age;
        document.querySelector("#edit-email").value = result.email;
        document.querySelector("#edit-password").value = result.password;
        document.querySelector("#edit-role").value = result.role;

        const edit_submit = document.querySelector("#edit_submit");

        edit_submit.onclick = async function (e) {
          e.preventDefault();

          const updatedUser = {
            firstName: document.querySelector("#edit-firstName").value,
            lastName: document.querySelector("#edit-lastName").value,
            age: document.querySelector("#edit-age").value,
            email: document.querySelector("#edit-email").value,
            password: document.querySelector("#edit-password").value,
            role: document.querySelector("#edit-role").value,
          };

          const responseEdit = await fetch(
            `http://localhost:3000/users/${userId}`,
            {
              method: "PUT",
              body: JSON.stringify(updatedUser),
              headers: {
                "Content-Type": "application/json",
              },
            },
          );

          if (responseEdit.ok) {
            alert("یوزر اپدیت شد");
            location.reload();
          } else {
            alert("اپدیت نشد");
          }
        };
      }
    </script>
  </body>
</html>
